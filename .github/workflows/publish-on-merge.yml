name: Publish to Nexus

on:
  push:
    branches: [master]
    paths:
      - 'templates/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version [skip ci]"
          git push

      - name: Configure Nexus registry
        run: |
          echo "//artifacts.maxilabs.net/repository/maxi-npm-hosted/:_authToken=${{ secrets.NEXUS_TOKEN }}" >> .npmrc

      - name: Publish
        run: npm publish --registry https://artifacts.maxilabs.net/repository/maxi-npm-hosted/
